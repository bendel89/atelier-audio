<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Atelier Audio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#0a0e1a;color:#e8ecf8;min-height:100vh;padding:1rem 1rem 6rem;font-size:15px;line-height:1.5;max-width:900px;margin:0 auto}
h1{text-align:center;font-size:1.5rem;margin-bottom:0.3rem;background:linear-gradient(135deg,#4a9eff,#7c5cff,#d94aff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;font-size:0.82rem;color:#8892b0;margin-bottom:1rem}
.tabs{display:flex;gap:0.3rem;background:#131829;border:1px solid #2a3350;border-radius:12px;padding:0.3rem;margin-bottom:1rem}
.tab{flex:1;padding:0.7rem;border-radius:9px;background:transparent;color:#8892b0;border:none;font-family:inherit;font-size:0.75rem;font-weight:600;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#4a9eff,#7c5cff);color:#fff}
.module{display:none}
.module.active{display:block}
.panel{background:#131829;border:1px solid #2a3350;border-radius:12px;padding:1rem;margin-bottom:1rem}
.lbl{font-size:0.7rem;color:#8892b0;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:0.6rem}
textarea{width:100%;padding:0.85rem;border-radius:10px;border:1px solid #2a3350;background:#1a2036;color:#e8ecf8;font-family:inherit;font-size:0.9rem;min-height:100px;resize:vertical;line-height:1.5}
textarea:focus{outline:none;border-color:#4a9eff}
select{width:100%;padding:0.85rem;border-radius:10px;border:1px solid #2a3350;background:#1a2036;color:#e8ecf8;font-family:inherit;font-size:0.9rem}
select:focus{outline:none;border-color:#4a9eff}
button.primary{width:100%;padding:1rem;border-radius:12px;border:none;background:linear-gradient(135deg,#4a9eff,#7c5cff);color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:1rem}
button.primary:active{transform:scale(0.98)}
button.primary:disabled{opacity:0.35;cursor:not-allowed}
.result{background:#131829;border:1px solid #2d8a4e;border-radius:12px;padding:1rem;margin-top:1rem;font-size:0.9rem;line-height:1.6;white-space:pre-wrap}
.audio-result{margin-top:1rem;padding:1rem;background:#131829;border:1px solid #2d8a4e;border-radius:12px}
.audio-result audio{width:100%;margin-bottom:0.5rem}
.audio-result a{color:#4a9eff;text-decoration:underline;font-size:0.8rem}
.status-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,0.95);color:#fff;padding:0.85rem 1rem;font-size:0.8rem;display:flex;align-items:center;gap:0.6rem;transform:translateY(100%);transition:transform 0.3s;z-index:100;border-top:1px solid #2a3350}
.status-bar.visible{transform:translateY(0)}
.spinner{width:14px;height:14px;border:2px solid rgba(74,158,255,0.3);border-top-color:#4a9eff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%) translateY(-100px);background:#131829;color:#fff;padding:0.9rem 1.4rem;border-radius:12px;font-size:0.85rem;border:1px solid #2a3350;z-index:1000;opacity:0;transition:all 0.35s;max-width:90vw;text-align:center}
.toast.visible{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{border-color:#2d8a4e}
.toast.error{border-color:#c0392b}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>Atelier Audio</h1>
<p class="sub">Voix · Musique · Chanson · Effets — Propulsé par l'IA</p>

<div class="tabs" id="tabs">
<button class="tab active" data-mod="voice">🎤 Voix off</button>
<button class="tab" data-mod="music">🎵 Musique</button>
<button class="tab" data-mod="song">🎙️ Chanson</button>
<button class="tab" data-mod="sfx">🔊 Effets</button>
</div>

<div class="module active" id="mod-voice">
<div class="panel">
<div class="lbl">🎤 Texte à lire</div>
<textarea id="voiceText" placeholder="Écris ici le texte que tu veux entendre en voix off. Exemple : Bienvenue dans mon Atelier Audio. Cette voix est générée par une intelligence artificielle."></textarea>
</div>
<div class="panel">
<div class="lbl">🎭 Voix</div>
<select id="voiceSelect">
<option value="female_fr">Féminine française</option>
<option value="male_fr">Masculine française</option>
<option value="female_en">Féminine anglaise</option>
<option value="male_en">Masculine anglaise</option>
</select>
</div>
<button class="primary" id="genVoice">Générer la voix</button>
<div id="voiceResult"></div>
</div>

<div class="module" id="mod-music">
<div class="panel">
<div class="lbl">🎵 Décris ta musique</div>
<textarea id="musicPrompt" placeholder="Exemples : hip-hop disco funky, électro techno dancefloor, rap français boom bap 90s, lo-fi chill détendu, jazz piano lounge"></textarea>
</div>
<div class="panel">
<div class="lbl">⏱️ Durée</div>
<select id="musicDuration">
<option value="5">5 secondes</option>
<option value="10" selected>10 secondes</option>
<option value="15">15 secondes</option>
<option value="20">20 secondes</option>
</select>
</div>
<button class="primary" id="genMusic">Générer la musique</button>
<div id="musicResult"></div>
</div>

<div class="module" id="mod-song">
<div class="panel">
<div class="lbl">🎙️ Paroles de la chanson</div>
<textarea id="songLyrics" placeholder="Écris les paroles de ta chanson. Exemple :&#10;Je marche dans la ville, les néons dans les yeux&#10;La nuit m'appelle, je suis enfin libre&#10;..."></textarea>
</div>
<div class="panel">
<div class="lbl">🎨 Style musical</div>
<textarea id="songStyle" placeholder="Exemples : hip-hop mélancolique, pop française, disco funk, rap conscient"></textarea>
</div>
<button class="primary" id="genSong">Générer la chanson</button>
<div id="songResult"></div>
</div>

<div class="module" id="mod-sfx">
<div class="panel">
<div class="lbl">🔊 Décris l'effet sonore</div>
<textarea id="sfxPrompt" placeholder="Exemples : pluie battante sur un toit, pas dans la neige, porte qui grince, tonnerre lointain, feu de camp, oiseaux dans une forêt"></textarea>
</div>
<button class="primary" id="genSfx">Générer l'effet</button>
<div id="sfxResult"></div>
</div>

<div class="status-bar" id="statusBar">
<div class="spinner"></div>
<span id="statusText">Préparation…</span>
</div>
<div class="toast" id="toast">
<span id="toastText">Message</span>
</div>
<script>
const FISH_API_KEY = 'sk-fish-REMPLACER';
const HF_API_KEY = 'hf_REMPLACER';
const FISH_API_URL = 'https://api.fish.audio/v1/tts';
const HF_API_URL = 'https://api-inference.huggingface.co/models/facebook/musicgen-small';

const state = {
voice:'female_fr',
musicDuration:10
};
</script>
<script>
function $(id){return document.getElementById(id);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function log(m){console.log('[Audio] '+m);}

let toastT=null;
function toast(msg,type){
type=type||'success';
const t=$('toast');if(!t)return;
t.className='toast';void t.offsetWidth;
t.classList.add(type,'visible');
$('toastText').textContent=msg;
if(toastT)clearTimeout(toastT);
toastT=setTimeout(()=>t.classList.remove('visible'),2800);
}

function setStatus(txt){
const b=$('statusBar'),t=$('statusText');
if(!b||!t)return;
if(txt){b.classList.add('visible');t.textContent=txt;}
else b.classList.remove('visible');
}

function initTabs(){
document.querySelectorAll('.tab').forEach(tab=>{
tab.addEventListener('click',()=>{
const mod=tab.dataset.mod;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));
tab.classList.add('active');
const el=$('mod-'+mod);
if(el)el.classList.add('active');
});
});
}

async function generateVoice(){
const text=$('voiceText').value.trim();
if(!text){toast('Écris d\'abord un texte','error');return;}
const voiceId=$('voiceSelect').value;
const btn=$('genVoice');
btn.disabled=true;btn.textContent='Génération…';
setStatus('L\'IA parle…');
try{
const res=await fetch(FISH_API_URL,{
method:'POST',
headers:{
'Authorization':'Bearer '+FISH_API_KEY,
'Content-Type':'application/json'
},
body:JSON.stringify({
text:text,
reference_id:voiceId,
format:'mp3',
mp3_bitrate:128
})
});
if(!res.ok){const e=await res.text();throw new Error('HTTP '+res.status+' — '+e.slice(0,150));}
const blob=await res.blob();
const url=URL.createObjectURL(blob);
$('voiceResult').innerHTML='<div class="audio-result"><audio controls src="'+url+'"></audio><a href="'+url+'" download="voix.mp3">⬇️ Télécharger la voix</a></div>';
toast('Voix générée ✓');
}catch(e){
toast('Erreur : '+e.message,'error',4000);
}finally{
btn.disabled=false;btn.textContent='Générer la voix';
setStatus(null);
}
}
</script>
<script>
async function generateMusic(){
const prompt=$('musicPrompt').value.trim();
if(!prompt){toast('Décris d\'abord ta musique','error');return;}
const duration=parseInt($('musicDuration').value,10);
const btn=$('genMusic');
btn.disabled=true;btn.textContent='Composition…';
setStatus('L\'IA compose…');
try{
const res=await fetch(HF_API_URL,{
method:'POST',
headers:{
'Authorization':'Bearer '+HF_API_KEY,
'Content-Type':'application/json'
},
body:JSON.stringify({
inputs:prompt,
parameters:{max_new_tokens:Math.round(duration*50)}
})
});
if(!res.ok){const e=await res.text();throw new Error('HTTP '+res.status+' — '+e.slice(0,150));}
const blob=await res.blob();
const url=URL.createObjectURL(blob);
$('musicResult').innerHTML='<div class="audio-result"><audio controls src="'+url+'"></audio><a href="'+url+'" download="musique.wav">⬇️ Télécharger la musique</a></div>';
toast('Musique générée ✓');
}catch(e){
toast('Erreur : '+e.message,'error',4000);
}finally{
btn.disabled=false;btn.textContent='Générer la musique';
setStatus(null);
}
}

async function generateSong(){
const lyrics=$('songLyrics').value.trim();
const style=$('songStyle').value.trim();
if(!lyrics){toast('Écris d\'abord des paroles','error');return;}
const btn=$('genSong');
btn.disabled=true;btn.textContent='Création…';
setStatus('L\'IA chante…');
try{
const prompt=(style?style+'. ':'')+lyrics;
const res=await fetch(HF_API_URL,{
method:'POST',
headers:{
'Authorization':'Bearer '+HF_API_KEY,
'Content-Type':'application/json'
},
body:JSON.stringify({
inputs:prompt,
parameters:{max_new_tokens:800}
})
});
if(!res.ok){const e=await res.text();throw new Error('HTTP '+res.status+' — '+e.slice(0,150));}
const blob=await res.blob();
const url=URL.createObjectURL(blob);
$('songResult').innerHTML='<div class="audio-result"><audio controls src="'+url+'"></audio><a href="'+url+'" download="chanson.wav">⬇️ Télécharger la chanson</a></div>';
toast('Chanson générée ✓');
}catch(e){
toast('Erreur : '+e.message,'error',4000);
}finally{
btn.disabled=false;btn.textContent='Générer la chanson';
setStatus(null);
}
}
</script>
<script>
async function generateSfx(){
const prompt=$('sfxPrompt').value.trim();
if(!prompt){toast('Décris d\'abord l\'effet','error');return;}
const btn=$('genSfx');
btn.disabled=true;btn.textContent='Création…';
setStatus('L\'IA crée le son…');
try{
const res=await fetch('https://api-inference.huggingface.co/models/facebook/audiogen-medium',{
method:'POST',
headers:{
'Authorization':'Bearer '+HF_API_KEY,
'Content-Type':'application/json'
},
body:JSON.stringify({
inputs:prompt,
parameters:{max_new_tokens:400}
})
});
if(!res.ok){const e=await res.text();throw new Error('HTTP '+res.status+' — '+e.slice(0,150));}
const blob=await res.blob();
const url=URL.createObjectURL(blob);
$('sfxResult').innerHTML='<div class="audio-result"><audio controls src="'+url+'"></audio><a href="'+url+'" download="effet.wav">⬇️ Télécharger l\'effet</a></div>';
toast('Effet généré ✓');
}catch(e){
toast('Erreur : '+e.message,'error',4000);
}finally{
btn.disabled=false;btn.textContent='Générer l\'effet';
setStatus(null);
}
}

(function init(){
initTabs();

$('genVoice').addEventListener('click',generateVoice);
$('voiceSelect').addEventListener('change',e=>{state.voice=e.target.value;});

$('genMusic').addEventListener('click',generateMusic);
$('musicDuration').addEventListener('change',e=>{state.musicDuration=parseInt(e.target.value,10);});

$('genSong').addEventListener('click',generateSong);
$('genSfx').addEventListener('click',generateSfx);

log('Atelier Audio prêt.');
})();
</script>
</body>
</html>
