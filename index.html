<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Audio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#0a0e1a;color:#e8ecf8;min-height:100vh;padding:1rem;font-size:15px;line-height:1.5;max-width:900px;margin:0 auto}
h1{text-align:center;font-size:1.5rem;margin-bottom:0.3rem;background:linear-gradient(135deg,#4a9eff,#7c5cff,#d94aff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;font-size:0.82rem;color:#8892b0;margin-bottom:1rem}
.panel{background:#131829;border:1px solid #2a3350;border-radius:12px;padding:1rem;margin-bottom:1rem}
.lbl{font-size:0.7rem;color:#8892b0;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:0.6rem}
textarea,input{width:100%;padding:0.85rem;border-radius:10px;border:1px solid #2a3350;background:#1a2036;color:#e8ecf8;font-family:inherit;font-size:0.9rem}
textarea{min-height:100px}
button.primary{width:100%;padding:1rem;border-radius:12px;border:none;background:linear-gradient(135deg,#4a9eff,#7c5cff);color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:1rem}
button.primary:disabled{opacity:0.35}
.result{margin-top:1rem;padding:1rem;background:#131829;border:1px solid #2d8a4e;border-radius:12px}
.result audio{width:100%}
.result a{color:#4a9eff;font-size:0.8rem}
.msg{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#131829;color:#fff;padding:0.9rem 1.4rem;border-radius:12px;font-size:0.85rem;border:1px solid #2a3350;z-index:1000;max-width:90vw;text-align:center;display:none}
.msg.ok{border-color:#2d8a4e}
.msg.err{border-color:#c0392b;background:#c0392b}
.msg.show{display:block}
.statut{font-size:0.72rem;color:#8892b0;margin-top:0.5rem}
.statut.ok{color:#6ee7a3}
</style>
</head>
<body>

<h1>Atelier Audio</h1>
<p class="sub">Voix off</p>

<div class="panel">
<div class="lbl">🔑 Token Replicate</div>
<input type="text" id="cle" placeholder="r8_..." autocomplete="off" spellcheck="false">
<button class="primary" id="btnEnr" style="padding:0.7rem;margin-top:0.5rem">Enregistrer</button>
<div class="statut" id="statut">Aucune clé</div>
</div>

<div class="panel">
<div class="lbl">🎤 Texte à lire</div>
<textarea id="texte" placeholder="Écris ton texte ici"></textarea>
</div>

<button class="primary" id="btnGen">Générer la voix</button>
<div id="resultat"></div>

<div class="msg" id="msg"></div>

<script>
var $=function(id){return document.getElementById(id);};

function message(txt,type){
var m=$('msg');
m.textContent=txt;
m.className='msg show '+(type||'');
setTimeout(function(){m.className='msg';},4000);
}

function actualiserStatut(){
var k=localStorage.getItem('cle_replicate')||'';
if(k){
$('statut').textContent='✓ Enregistrée ('+k.slice(0,8)+'...)';
$('statut').className='statut ok';
$('cle').value=k;
}else{
$('statut').textContent='Aucune clé';
$('statut').className='statut';
$('cle').value='';
}
}

$('btnEnr').onclick=function(){
var k=$('cle').value.trim();
if(!k){message('Colle ta clé','err');return;}
if(!k.startsWith('r8_')){message('La clé doit commencer par r8_','err');return;}
localStorage.setItem('cle_replicate',k);
actualiserStatut();
message('Clé enregistrée ✓','ok');
};

$('btnGen').onclick=function(){
var texte=$('texte').value.trim();
if(!texte){message('Écris un texte','err');return;}
var cle=localStorage.getItem('cle_replicate');
if(!cle){message('Enregistre ta clé d\'abord','err');return;}
message('Génération en cours...','ok');

fetch('https://api.replicate.com/v1/models/suno-ai/bark/predictions',{
method:'POST',
headers:{
'Authorization':'Token '+cle,
'Content-Type':'application/json'
},
body:JSON.stringify({
input:{prompt:texte,history_prompt:'v2/fr_speaker_0'}
})
})
.then(function(r){
if(!r.ok){
return r.text().then(function(t){throw new Error('HTTP '+r.status+' : '+t.slice(0,100));});
}
return r.json();
})
.then(function(pred){
var getUrl=pred.urls.get;
var tentatives=0;
function attendre(){
tentatives++;
if(tentatives>60){message('Délai dépassé','err');return;}
fetch(getUrl,{headers:{'Authorization':'Token '+cle}})
.then(function(r){return r.json();})
.then(function(p){
if(p.status==='succeeded'){
var audio=p.output;
if(Array.isArray(audio))audio=audio[0];
$('resultat').innerHTML='<div class="result"><audio controls src="'+audio+'"></audio><br><a href="'+audio+'" download="voix.wav">⬇️ Télécharger</a></div>';
message('Voix générée ✓','ok');
}else if(p.status==='failed'){
message('Échec : '+(p.error||'inconnu'),'err');
}else{
message('Traitement... '+tentatives+'/60','ok');
setTimeout(attendre,3000);
}
});
}
setTimeout(attendre,3000);
})
.catch(function(e){message('Erreur : '+e.message,'err');});
};

actualiserStatut();
</script>
</body>
</html>
