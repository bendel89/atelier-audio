<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Audio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#0a0e1a;color:#e8ecf8;min-height:100vh;padding:1rem 1rem 6rem;font-size:15px;line-height:1.5;max-width:900px;margin:0 auto}
h1{text-align:center;font-size:1.5rem;margin-bottom:0.3rem;background:linear-gradient(135deg,#4a9eff,#7c5cff,#d94aff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;font-size:0.82rem;color:#8892b0;margin-bottom:1rem}
.panel{background:#131829;border:1px solid #2a3350;border-radius:12px;padding:1rem;margin-bottom:1rem}
.lbl{font-size:0.7rem;color:#8892b0;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:0.6rem}
textarea,input{width:100%;padding:0.85rem;border-radius:10px;border:1px solid #2a3350;background:#1a2036;color:#e8ecf8;font-family:inherit;font-size:0.9rem}
textarea{min-height:100px;resize:vertical}
select{width:100%;padding:0.85rem;border-radius:10px;border:1px solid #2a3350;background:#1a2036;color:#e8ecf8;font-family:inherit;font-size:0.9rem}
button.primary{width:100%;padding:1rem;border-radius:12px;border:none;background:linear-gradient(135deg,#4a9eff,#7c5cff);color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:1rem}
button.primary:disabled{opacity:0.35}
.tabs{display:flex;gap:0.3rem;background:#131829;border:1px solid #2a3350;border-radius:12px;padding:0.3rem;margin-bottom:1rem}
.tab{flex:1;padding:0.7rem;border-radius:9px;background:transparent;color:#8892b0;border:none;font-family:inherit;font-size:0.75rem;font-weight:600;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#4a9eff,#7c5cff);color:#fff}
.module{display:none}
.module.active{display:block}
.audio-result{margin-top:1rem;padding:1rem;background:#131829;border:1px solid #2d8a4e;border-radius:12px}
.audio-result audio{width:100%;margin-bottom:0.5rem}
.audio-result a{color:#4a9eff;text-decoration:underline;font-size:0.8rem}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#2d8a4e;color:#fff;padding:0.9rem 1.4rem;border-radius:12px;font-size:0.85rem;z-index:1000;display:none}
.toast.visible{display:block}
</style>
</head>
<body>

<h1>Atelier Audio</h1>
<p class="sub">Voix · Musique · Chanson · Effets</p>

<div class="panel">
<div class="lbl">🔑 Clés API</div>
<input type="password" id="fishKey" placeholder="Clé Fish Audio (sk-fish-...)">
<input type="password" id="hfKey" placeholder="Token Hugging Face (hf_...)" style="margin-top:0.5rem">
<div style="font-size:0.7rem;color:#6ee7a3;margin-top:0.5rem">✓ Enregistrement automatique</div>
</div>

<div class="tabs">
<button class="tab active" data-mod="voice">🎤 Voix off</button>
<button class="tab" data-mod="music">🎵 Musique</button>
<button class="tab" data-mod="song">🎙️ Chanson</button>
<button class="tab" data-mod="sfx">🔊 Effets</button>
</div>

<div class="module active" id="mod-voice">
<div class="panel">
<div class="lbl">🎤 Texte à lire</div>
<textarea id="voiceText" placeholder="Écris ici le texte à lire"></textarea>
</div>
<div class="panel">
<div class="lbl">🎭 Voix</div>
<select id="voiceSelect">
<option value="female_fr">Féminine française</option>
<option value="male_fr">Masculine française</option>
</select>
</div>
<button class="primary" onclick="generateVoice()">Générer la voix</button>
<div id="voiceResult"></div>
</div>

<div class="module" id="mod-music">
<div class="panel">
<div class="lbl">🎵 Décris ta musique</div>
<textarea id="musicPrompt" placeholder="Exemples : hip-hop disco funky"></textarea>
</div>
<div class="panel">
<div class="lbl">⏱️ Durée (secondes)</div>
<input type="number" id="musicDur" value="10" min="3" max="30">
</div>
<button class="primary" onclick="generateMusic()">Générer la musique</button>
<div id="musicResult"></div>
</div>

<div class="module" id="mod-song">
<div class="panel">
<div class="lbl">🎙️ Paroles</div>
<textarea id="songLyrics" placeholder="Écris les paroles"></textarea>
</div>
<button class="primary" onclick="generateSong()">Générer la chanson</button>
<div id="songResult"></div>
</div>

<div class="module" id="mod-sfx">
<div class="panel">
<div class="lbl">🔊 Décris l'effet</div>
<textarea id="sfxPrompt" placeholder="Exemples : pluie battante"></textarea>
</div>
<button class="primary" onclick="generateSfx()">Générer l'effet</button>
<div id="sfxResult"></div>
</div>

<div class="toast" id="toast">Message</div>

<script>
function $(id){return document.getElementById(id);}
function showToast(msg){
var t=$('toast');
t.textContent=msg;
t.classList.add('visible');
setTimeout(function(){t.classList.remove('visible');},2500);
}

var fishInput=$('fishKey');
var hfInput=$('hfKey');
fishInput.value=localStorage.getItem('fish_key')||'';
hfInput.value=localStorage.getItem('hf_key')||'';
fishInput.addEventListener('input',function(){
localStorage.setItem('fish_key',fishInput.value.trim());
});
hfInput.addEventListener('input',function(){
localStorage.setItem('hf_key',hfInput.value.trim());
});

document.querySelectorAll('.tab').forEach(function(tab){
tab.addEventListener('click',function(){
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
document.querySelectorAll('.module').forEach(function(m){m.classList.remove('active');});
tab.classList.add('active');
$('mod-'+tab.dataset.mod).classList.add('active');
});
});

function generateVoice(){
var text=$('voiceText').value.trim();
if(!text){showToast('Écris un texte');return;}
var key=localStorage.getItem('fish_key');
if(!key){showToast('Entre ta clé Fish en haut');return;}
showToast('Génération...');
fetch('https://api.fish.audio/v1/tts',{
method:'POST',
headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
body:JSON.stringify({text:text,format:'mp3'})
})
.then(function(r){
if(!r.ok)throw new Error('Erreur '+r.status);
return r.blob();
})
.then(function(blob){
var url=URL.createObjectURL(blob);
$('voiceResult').innerHTML='<div class="audio-result"><audio controls src="'+url+'"></audio><a href="'+url+'" download="voix.mp3">⬇️ Télécharger</a></div>';
showToast('Voix générée ✓');
})
.catch(function(e){showToast('Erreur : '+e.message);});
}

function hfGen(url,prompt,tokens,resultId,filename){
var key=localStorage.getItem('hf_key');
if(!key){showToast('Entre ton token HF en haut');return;}
showToast('Génération...');
fetch(url,{
method:'POST',
headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
body:JSON.stringify({inputs:prompt,parameters:{max_new_tokens:tokens}})
})
.then(function(r){
if(!r.ok)throw new Error('Erreur '+r.status);
return r.blob();
})
.then(function(blob){
var u=URL.createObjectURL(blob);
$(resultId).innerHTML='<div class="audio-result"><audio controls src="'+u+'"></audio><a href="'+u+'" download="'+filename+'">⬇️ Télécharger</a></div>';
showToast('Généré ✓');
})
.catch(function(e){showToast('Erreur : '+e.message);});
}

function generateMusic(){
var p=$('musicPrompt').value.trim();
if(!p){showToast('Décris ta musique');return;}
var d=parseInt($('musicDur').value,10)||10;
hfGen('https://api-inference.huggingface.co/models/facebook/musicgen-small',p,d*50,'musicResult','musique.wav');
}

function generateSong(){
var l=$('songLyrics').value.trim();
if(!l){showToast('Écris des paroles');return;}
hfGen('https://api-inference.huggingface.co/models/facebook/musicgen-small',l,800,'songResult','chanson.wav');
}

function generateSfx(){
var p=$('sfxPrompt').value.trim();
if(!p){showToast('Décris l\'effet');return;}
hfGen('https://api-inference.huggingface.co/models/facebook/audiogen-medium',p,400,'sfxResult','effet.wav');
}
</script>
</body>
</html>
